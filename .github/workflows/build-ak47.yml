name: Build AK-47 Plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'AK47Plugin.archive.b64/**'
      - 'AK47Plugin/patches/**'
      - '.github/workflows/build-ak47.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Restore and verify AK-47 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat AK47Plugin.archive.b64/part-*.txt | tr -d '\n' | base64 --decode > /tmp/AK47Plugin.tar.xz
          xz --test /tmp/AK47Plugin.tar.xz
          mkdir -p /tmp/ak47-src
          tar -xJf /tmp/AK47Plugin.tar.xz -C /tmp/ak47-src
          test -f /tmp/ak47-src/AK47Plugin/pom.xml
          test -f /tmp/ak47-src/AK47Plugin/src/main/java/ru/ak47/AK47Plugin.java
          test -f /tmp/ak47-src/AK47Plugin/resource-pack/pack.mcmeta

      - name: Apply Minecraft 1.21.11 client input fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("/tmp/ak47-src/AK47Plugin/client-mod/src/main/java/ru/ak47/client/AK47ReloadKeyClient.java")
          code = source.read_text(encoding="utf-8")
          old = "GLFW.glfwGetMouseButton(client.getWindow().getHandle(), GLFW.GLFW_MOUSE_BUTTON_RIGHT) == GLFW.GLFW_PRESS"
          if old not in code:
              raise SystemExit("Expected old mouse-input expression was not found; refusing to patch unexpected source.")
          code = code.replace(old, "client.mouseHandler.isRightPressed()")
          code = code.replace("import org.lwjgl.glfw.GLFW;\\n", "")
          source.write_text(code, encoding="utf-8")
          PY

      - name: Build Purpur plugin JAR
        run: mvn --batch-mode -f /tmp/ak47-src/AK47Plugin/pom.xml clean package

      - name: Build Fabric client mod JAR
        run: gradle --no-daemon -p /tmp/ak47-src/AK47Plugin/client-mod build

      - name: Prepare downloadable release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/ak47-src/AK47Plugin/target/AK47-1.0.0.jar dist/
          cp /tmp/ak47-src/AK47Plugin/client-mod/build/libs/AK47-Reload-Key-1.0.0.jar dist/
          (cd /tmp/ak47-src/AK47Plugin/resource-pack && zip -qr "$GITHUB_WORKSPACE/dist/AK47-Resource-Pack-1.0.0.zip" .)
          tar -cJf dist/AK47-Purpur-1.21.11-Source.tar.xz --exclude='AK47Plugin/target' --exclude='AK47Plugin/client-mod/build' -C /tmp/ak47-src AK47Plugin
          cp /tmp/ak47-src/AK47Plugin/README_RU.md dist/

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AK47-Purpur-1.21.11
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ak47-v1.0.0 dist/AK47-1.0.0.jar dist/AK47-Reload-Key-1.0.0.jar dist/AK47-Resource-Pack-1.0.0.zip dist/AK47-Purpur-1.21.11-Source.tar.xz --title "AK-47 v1.0.0 for Purpur 1.21.11" --notes-file dist/README_RU.md --target "$GITHUB_SHA" || gh release upload ak47-v1.0.0 dist/AK47-1.0.0.jar dist/AK47-Reload-Key-1.0.0.jar dist/AK47-Resource-Pack-1.0.0.zip dist/AK47-Purpur-1.21.11-Source.tar.xz --clobber
